[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mortis"
version = "0.2.2"
description = "莫提斯：智能体元数据刮削管理器"
requires-python = ">=3.14"
license = "GPL-3.0-only"
dependencies = [
    "fastapi>=0.163",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "sqlalchemy>=2.1.8",
    "alembic>=1.20.1",
    "tomli-w>=1.2",
    "httpx2>=2.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "ruff>=0.17",
    "playwright>=1.65",
    "pyinstaller>=6.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mortis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not e2e'"
markers = ["e2e: 用本机 Edge 走一遍页面，需要先构建前端（npm run build）"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["mortis", "tests"]
