[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mortis"
version = "0.0.1"
description = "莫提斯：智能体元数据刮削管理器"
requires-python = ">=3.14"
license = "GPL-3.0-only"
dependencies = [
    "fastapi>=0.163",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "httpx>=0.28",
    "ruff>=0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mortis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
