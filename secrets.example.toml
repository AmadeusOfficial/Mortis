# 莫提斯密钥示例。真实文件是数据目录下的 secrets.toml，由设置页写入，不进 git。
# 代理账号和来源、插件的密钥分开写在不同节里。

[network]
# 代理账号，留空表示不用认证
proxy_username = ""
proxy_password = ""

[sources.tmdb]
# TMDB 的 API Key，v3 的 key 或 v4 的令牌
api_key = ""

[ai]
# 智能体用的模型接口的 key，例如 DeepSeek
api_key = ""

# 来源插件和插件的密钥写在 [sources.<id>]，例如 Bangumi：
# [sources.bangumi]
# app_id = ""
# app_secret = ""
# access_token = ""
