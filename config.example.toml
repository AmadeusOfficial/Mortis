# 莫提斯普通设置示例。真实文件是数据目录下的 config.toml，由设置页写入，不进 git。

# 停用的插件 id；插件自己的设置写在 [plugins.<id>]
disabled_plugins = []

[network]
# 代理主机，留空表示不用代理
proxy_host = "127.0.0.1"
proxy_port = 7890
ignore_cert_errors = true

[files]
# 扫描时认作视频的扩展名
video_extensions = [
    ".3gp", ".asf", ".asx", ".avc", ".avi", ".bdmv", ".bin", ".bivx", ".braw", ".dat",
    ".divx", ".dv", ".dvr-ms", ".disc", ".evo", ".f4v", ".fli", ".flv", ".h264", ".ifo",
    ".img", ".iso", ".mts", ".mt2s", ".m2ts", ".m2v", ".m4v", ".mkv", ".mk3d", ".mov",
    ".mp4", ".mpeg", ".mpg", ".nrg", ".nsv", ".nuv", ".ogm", ".ogv", ".pva", ".qt", ".rm",
    ".rmvb", ".strm", ".svq3", ".ts", ".ty", ".viv", ".vob", ".vp3", ".wmv", ".webm",
    ".xvid",
]
# 扫描时认作字幕的扩展名
subtitle_extensions = [
    ".aqt", ".ass", ".cvd", ".dks", ".idx", ".jss", ".mpl", ".pjs", ".psb", ".rt", ".smi",
    ".srt", ".ssa", ".ssf", ".sub", ".sup", ".svcd", ".ttxt", ".usf", ".vtt",
]

[movie]
# 刮削语言，TMDB 的语言代码
language = "zh-CN"
# 分级取哪个国家的
certification_country = "US"
include_adult = true
# 自动识别时，相似度低于这个值就放进未识别
match_threshold = 0.75
# 扫描时跳过的文件夹名
skip_folders = ["MAKEMKV"]
poster_size = "w780"
fanart_size = "original"
# 同人画优先选没有文字的
prefer_textless_fanart = true

[movie.images]
# 刮削时抓哪些图
poster = true
fanart = true
clearlogo = true
keyart = true
collection_poster = true
collection_fanart = true
actor_images = true

[movie.output]
# 刮削后自动整理
organize_after_scrape = true
# 整理时按模板重命名目录和文件
organize_rename = false
# 整理时把 NFO 和图片写到视频旁边
organize_write_files = true
# NFO 文件名：movie 写 movie.nfo，filename 写 <视频名>.nfo
nfo_names = ["movie", "filename"]
# 图片文件名：filename 写 <视频名>-poster.jpg，plain 写 poster.jpg
image_style = "filename"
# 系列图写成 movieset-poster.jpg / movieset-fanart.jpg
collection_image_names = true
# 演员头像放在哪个目录
actor_images_folder = ".actors"
# 目录名模板
folder_template = "${title} ${- ,edition,} (${year})"
# 文件名模板
file_template = "${title}${- ,edition,}.${videoFormat}.${audioCodec}"
# 目录名里的空格换成什么，留空不换
folder_space = ""
# 文件名里的空格换成什么
file_space = "."
# 冒号换成什么
colon_replacement = "-"
# 名字开头的数字换成什么
first_char_number = "#"
# NFO 里写入锁定标记
nfo_write_lockdata = false
# NFO 只写一个制片公司
nfo_single_studio = false

[tv]
# 刮削语言，TMDB 的语言代码
language = "zh-CN"
# 分级取哪个国家的
certification_country = "US"
include_adult = true
# 自动识别时，相似度低于这个值就放进未识别
match_threshold = 0.75
# 扫描时跳过的文件夹名
skip_folders = ["MAKEMKV"]
poster_size = "w780"
fanart_size = "original"
# 剧集缩略图的尺寸
still_size = "w300"
# 同人画优先选没有文字的
prefer_textless_fanart = true
# 显示缺少的集
show_missing_episodes = true
# 显示缺少的特别篇
show_missing_specials = true

[tv.images]
# 刮削时抓哪些图
poster = true
fanart = true
clearlogo = true
keyart = true
season_poster = true
episode_thumb = true
# 演员头像不写
actor_images = false

[tv.output]
# 刮削后自动整理
organize_after_scrape = true
# 整理时按模板重命名目录和文件
organize_rename = true
# 整理时把 NFO 和图片写到视频旁边
organize_write_files = true
# 剧目录名模板
show_template = "${showTitle} (${showYear})"
# 季目录名模板
season_template = "Season ${seasonNr}"
# 文件名模板
file_template = "${showTitle}.S${seasonNr2}E${episodeNr2}.${title}"
# 剧目录名里的空格换成什么，留空不换
show_space = ""
# 季目录名里的空格换成什么，留空不换
season_space = ""
# 文件名里的空格换成什么
file_space = "."
# 冒号换成什么
colon_replacement = " "
# 名字开头的数字换成什么
first_char_number = "#"
# NFO 里写入锁定标记
nfo_write_lockdata = false
# NFO 只写一个制片公司
nfo_single_studio = false

[anime]
# 刮削语言，TMDB 的语言代码
language = "zh-CN"
# 分级取哪个国家的
certification_country = "US"
include_adult = true
# 自动识别时，相似度低于这个值就放进未识别
match_threshold = 0.75
# 扫描时跳过的文件夹名
skip_folders = ["MAKEMKV"]
poster_size = "w780"
fanart_size = "original"
# 集缩略图的尺寸
still_size = "w300"
# 同人画优先选没有文字的
prefer_textless_fanart = true
# 显示缺少的集
show_missing_episodes = true
# 显示缺少的特别篇
show_missing_specials = true

[anime.images]
# 刮削时抓哪些图
poster = true
fanart = true
clearlogo = true
keyart = true
season_poster = true
episode_thumb = true
# 演员头像不写
actor_images = false

[anime.output]
# 刮削后自动整理
organize_after_scrape = true
# 整理时按模板重命名目录和文件
organize_rename = true
# 整理时把 NFO 和图片写到视频旁边
organize_write_files = true
# 动漫目录名模板
show_template = "${showTitle} (${showYear})"
# 季目录名模板
season_template = "Season ${seasonNr}"
# 文件名模板
file_template = "${showTitle}.S${seasonNr2}E${episodeNr2}.${title}"
# 动漫目录名里的空格换成什么，留空不换
show_space = ""
# 季目录名里的空格换成什么，留空不换
season_space = ""
# 文件名里的空格换成什么
file_space = "."
# 冒号换成什么
colon_replacement = " "
# 名字开头的数字换成什么
first_char_number = "#"
# NFO 里写入锁定标记
nfo_write_lockdata = false
# NFO 只写一个制片公司
nfo_single_studio = false

[tasks]
# 任务并发数，改了重启后生效
concurrency = 3
# 已结束的任务保留多少天
keep_days = 30
